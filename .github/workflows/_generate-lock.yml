name: Temporary lockfile generation

on:
  push:
    branches:
      - ci/main-dev-gates

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Regenerate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm update body-parser --package-lock-only --ignore-scripts --no-audit
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): refresh patched npm lockfile"
            git push origin HEAD:ci/main-dev-gates
          else
            echo "Lockfile already up to date."
          fi
      - name: Verify high and critical dependency audit
        run: npm audit --audit-level=high
      - name: Verify package signatures
        run: npm audit signatures
