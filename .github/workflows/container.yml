name: Container

on:
  workflow_call:
    outputs:
      digest:
        description: Digest of the scanned OCI image
        value: ${{ jobs.image.outputs.digest }}
      artifact_id:
        description: ID of the verified image artifact
        value: ${{ jobs.image.outputs.artifact_id }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  image:
    name: Build and scan the immutable OCI artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tags belong to main
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a vX.Y.Z release tag'; exit 1; }
            git merge-base --is-ancestor "$COMMIT" origin/main
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$COMMIT")" >> "$GITHUB_ENV"
      - name: Set exact Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact Buildx and Trivy binaries
        run: bash scripts/ci/install-tools.sh buildx trivy
      - name: Start digest-pinned BuildKit
        run: |
          mkdir -p .ci/artifacts
          builder=$(node --input-type=module -e "import fs from 'node:fs';console.log(JSON.parse(fs.readFileSync('scripts/ci/images.lock.json')).buildkit)")
          docker buildx create --name stanelabs-ci --driver docker-container --driver-opt "image=$builder" --use
          docker buildx inspect --bootstrap
      - name: Build OCI archive without publication credentials
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          tags: stanelabs:ci
          outputs: type=oci,dest=.ci/artifacts/image.oci.tar
          provenance: mode=max
          sbom: false
          github-token: ''
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Extract the web archive from the same image and record inputs
        env:
          EXPECTED_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 scripts/ci/prepare-artifacts.py
      - name: Scan the actual runtime image
        env:
          EXPECTED_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          trivy image --cache-dir .ci/trivy --input ".ci/image@$EXPECTED_IMAGE_DIGEST" \
            --scanners vuln,misconfig,secret --image-config-scanners misconfig,secret --skip-check-update \
            --severity HIGH,CRITICAL --exit-code 1 --format json --output .ci/artifacts/trivy-image.json
      - name: Generate SBOMs and checksums
        env:
          EXPECTED_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          trivy image --cache-dir .ci/trivy --input ".ci/image@$EXPECTED_IMAGE_DIGEST" --format spdx-json --output .ci/artifacts/image.sbom.spdx.json
          trivy fs --cache-dir .ci/trivy --format spdx-json --output .ci/artifacts/web.sbom.spdx.json .ci/site
          trivy fs --cache-dir .ci/trivy --include-dev-deps --skip-dirs node_modules --skip-dirs backend/node_modules \
            --skip-dirs .next --skip-dirs .ci --skip-dirs dist --skip-dirs backend/dist \
            --format spdx-json --output .ci/artifacts/source-dependencies.sbom.spdx.json .
          node scripts/ci/record-scan.mjs
          node scripts/ci/checksums.mjs
      - name: Retain the exact scanned artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
