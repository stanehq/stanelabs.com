name: Publish

on:
  workflow_call:
    inputs:
      digest:
        description: Digest produced by the container workflow
        required: true
        type: string
      artifact_id:
        description: Verified artifact ID produced by the container workflow
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish the scanned digest and sign provenance/SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ghcr
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout publication scripts without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set exact Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install checksum-verified registry and verification tools
        run: bash scripts/ci/install-tools.sh regctl gh
      - name: Download the verified image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: .ci/artifacts
          merge-multiple: true
      - name: Verify archive checksums and source identity
        env:
          EXPECTED_IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          (cd .ci/artifacts && sha256sum --check SHA256SUMS && sha512sum --check SHA512SUMS)
          python3 scripts/ci/prepare-artifacts.py --verify-only
          node --input-type=module -e "import fs from 'node:fs';const info=JSON.parse(fs.readFileSync('.ci/artifacts/build-info.json'));if(info.sourceCommit!==process.env.GITHUB_SHA||info.sourceRef!==process.env.GITHUB_REF)throw new Error('Source identity mismatch')"
      - name: Log in to private GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the OCI bytes and enforce the remote digest
        id: publication
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_DIGEST: ${{ inputs.digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          candidate="candidate-$RUN_ID-$RUN_ATTEMPT"
          regctl image copy "ocidir://.ci/image@$EXPECTED_DIGEST" "$image:$candidate" --force-recursive
          actual=$(regctl image digest "$image:$candidate")
          [[ "$actual" == "$EXPECTED_DIGEST" ]] || { echo 'Registry changed the scanned OCI digest'; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Sign image provenance
        id: image-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.publication.outputs.image }}
          subject-digest: ${{ inputs.digest }}
          push-to-registry: true
      - name: Sign runtime SBOM
        id: image-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.publication.outputs.image }}
          subject-digest: ${{ inputs.digest }}
          sbom-path: .ci/artifacts/image.sbom.spdx.json
          push-to-registry: true
      - name: Sign extracted web archive provenance
        id: files-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            .ci/artifacts/stanelabs-web.tar
            .ci/artifacts/SHA256SUMS
            .ci/artifacts/SHA512SUMS
            .ci/artifacts/build-info.json
            .ci/artifacts/source-dependencies.sbom.spdx.json
      - name: Sign static asset SBOM
        id: web-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .ci/artifacts/stanelabs-web.tar
          sbom-path: .ci/artifacts/web.sbom.spdx.json
      - name: Verify signatures and source identity
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.publication.outputs.image }}
          DIGEST: ${{ inputs.digest }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          policy=(--repo "$SOURCE_REPO" --signer-workflow "$SOURCE_REPO/.github/workflows/publish.yml" --source-ref "$SOURCE_REF" --source-digest "$SOURCE_COMMIT" --deny-self-hosted-runners)
          case "$REPOSITORY_PRIVATE" in
            true) policy+=(--no-public-good) ;;
            false) ;;
            *) echo 'Missing trusted repository visibility'; exit 1 ;;
          esac
          mkdir -p .ci/attestations
          gh attestation verify "oci://$IMAGE@$DIGEST" "${policy[@]}" --format json > .ci/attestations/image.provenance.verified.json
          gh attestation verify "oci://$IMAGE@$DIGEST" "${policy[@]}" --predicate-type https://spdx.dev/Document/v2.3 --format json > .ci/attestations/image.sbom.verified.json
          gh attestation verify .ci/artifacts/stanelabs-web.tar "${policy[@]}" --format json > .ci/attestations/web.provenance.verified.json
          gh attestation verify .ci/artifacts/stanelabs-web.tar "${policy[@]}" --predicate-type https://spdx.dev/Document/v2.3 --format json > .ci/attestations/web.sbom.verified.json
          for artifact in SHA256SUMS SHA512SUMS build-info.json source-dependencies.sbom.spdx.json; do
            gh attestation verify ".ci/artifacts/$artifact" "${policy[@]}" --format json > ".ci/attestations/$artifact.provenance.verified.json"
          done
      - name: Promote verified aliases
        env:
          IMAGE: ${{ steps.publication.outputs.image }}
          DIGEST: ${{ inputs.digest }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            tags=$(regctl tag ls "$IMAGE")
            if [[ $'\n'"$tags"$'\n' == *$'\n'"$REF_NAME"$'\n'* ]]; then
              [[ "$(regctl image digest "$IMAGE:$REF_NAME")" == "$DIGEST" ]] || { echo 'Release tag already identifies a different digest'; exit 1; }
            fi
            tag="$REF_NAME"
          else
            tag=main
          fi
          regctl image copy "$IMAGE@$DIGEST" "$IMAGE:sha-$COMMIT"
          regctl image copy "$IMAGE@$DIGEST" "$IMAGE:$tag"
          [[ "$(regctl image digest "$IMAGE:sha-$COMMIT")" == "$DIGEST" ]]
          [[ "$(regctl image digest "$IMAGE:$tag")" == "$DIGEST" ]]
      - name: Retain signed bundles
        env:
          IMAGE_PROVENANCE_BUNDLE: ${{ steps.image-provenance.outputs.bundle-path }}
          IMAGE_SBOM_BUNDLE: ${{ steps.image-sbom.outputs.bundle-path }}
          FILES_PROVENANCE_BUNDLE: ${{ steps.files-provenance.outputs.bundle-path }}
          WEB_SBOM_BUNDLE: ${{ steps.web-sbom.outputs.bundle-path }}
        run: |
          mkdir -p .ci/attestations
          cp "$IMAGE_PROVENANCE_BUNDLE" .ci/attestations/image.provenance.sigstore.json
          cp "$IMAGE_SBOM_BUNDLE" .ci/attestations/image.sbom.sigstore.json
          cp "$FILES_PROVENANCE_BUNDLE" .ci/attestations/files.provenance.sigstore.json
          cp "$WEB_SBOM_BUNDLE" .ci/attestations/web.sbom.sigstore.json
      - name: Upload verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: attestations-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/attestations/
          if-no-files-found: error
          retention-days: 30
      - name: Show the verified publication
        env:
          IMAGE: ${{ steps.publication.outputs.image }}
          DIGEST: ${{ inputs.digest }}
          COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          {
            printf '%s\n\n' '## Verified StaneLabs publication'
            printf '**Image:** `%s@%s`\n\n' "$IMAGE" "$DIGEST"
            printf '**Commit:** `%s` - **Ref:** `%s` - **Platform:** `linux/amd64`\n\n' "$COMMIT" "$SOURCE_REF"
            printf '**Artifacts:** `verified-image-%s-%s`, `attestations-%s-%s`\n\n' "$RUN_ID" "$RUN_ATTEMPT" "$RUN_ID" "$RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"
