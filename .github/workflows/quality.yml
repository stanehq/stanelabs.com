name: Quality

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint and type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set exact Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Generate updated lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Retain generated lockfile temporarily
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stanelabs-updated-lockfile-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Verify dependency pins and install locked dependencies
        run: |
          node scripts/ci/verify-pins.mjs
          npm ci --ignore-scripts
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
