name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    uses: $/.github/workflows/quality.yml

  tests:
    name: Tests
    uses: $/.github/workflows/tests.yml

  security:
    name: Security
    uses: $/.github/workflows/security.yml

  container:
    name: Container
    needs: [quality, tests, security]
    uses: $/.github/workflows/container.yml

  publish:
    name: Publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [quality, tests, security, container]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: $/.github/workflows/publish.yml
    with:
      digest: ${{ needs.container.outputs.digest }}
      artifact_id: ${{ needs.container.outputs.artifact_id }}
